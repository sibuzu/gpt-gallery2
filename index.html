<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示詞生成</title>
  <link rel="icon" href="favorit.ico?v=20261102-2" type="image/x-icon">
    <link rel="stylesheet" href="styles/gallery.css?v=1793930887">
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <div class="title-line">
          <h1>提示詞生成</h1>
          <a class="review-link" href="review.html">REVIEW</a>
          <button class="title-toggle icon-button" id="expandAllToggle" type="button" aria-label="全部展開" title="全部展開">
            <img src="expand-svgrepo-com.svg" alt="">
          </button>
          <p class="meta"><span id="visibleCount">0</span>/<span id="totalCount">0</span> images</p>
        </div>
      </div>
      <select class="category-menu" id="categoryMenu" aria-label="圖片分類"></select>
      <input class="search" id="search" type="search" placeholder="搜尋檔名或類別">
    </div>
    <nav class="filters" id="filters" aria-label="圖片分類"></nav>
  </header>

  <main>
    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty">沒有符合條件的圖片</p>
    <nav class="pagination" id="pagination" aria-label="圖片分頁"></nav>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="close" id="close" type="button" aria-label="關閉">×</button>
    <figure>
      <img id="preview" alt="">
      <figcaption id="previewCaption"></figcaption>
    </figure>
  </div>
  <dialog class="four-view" id="fourView" aria-labelledby="fourViewTitle">
    <div class="four-view-images" id="fourViewImages"></div>
    <p class="four-view-title" id="fourViewTitle" aria-live="polite"></p>
    <button class="four-view-control four-view-previous" id="fourViewPrevious" type="button" aria-label="上一頁" title="上一頁（←）">‹</button>
    <button class="four-view-control four-view-next" id="fourViewNext" type="button" aria-label="下一頁" title="下一頁（→）">›</button>
    <button class="four-view-control four-view-close" id="fourViewClose" type="button" aria-label="離開四欄檢視" title="離開四欄檢視（Esc）">×</button>
  </dialog>
  <script src="scripts/gallery-data.js?v=1793930887" defer></script>
</body>
</html>
